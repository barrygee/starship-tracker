# Fallback for when the browser can't fetch the feed directly (CORS).
# Every 5 minutes, downloads the feed and commits it as data.json.
name: Fetch Starship data

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download feed
        run: |
          curl -fsSL -A "Mozilla/5.0" \
            "https://sxcontent9668.azureedge.us/cms-assets/starship_tracker_public.json" \
            -o data.json.new
          python3 -m json.tool data.json.new > /dev/null   # make sure it's valid JSON
          mv data.json.new data.json
      - name: Commit if changed
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add data.json
          git diff --cached --quiet || (git commit -m "Update data.json" && git push)
